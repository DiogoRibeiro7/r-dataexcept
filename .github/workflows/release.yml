# Cut a GitHub release when a version tag is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The workflow refuses to continue unless the tag matches the version in
# DESCRIPTION and CITATION.cff and NEWS.md has a section for it -- the same
# check `Rscript tools/release.R check <tag>` runs locally. It then runs
# R CMD check --as-cran on the built tarball and publishes a release with the
# tarball attached and that NEWS.md section as the release notes.
on:
  push:
    tags: ['v*.*.*']

name: release

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Check the tag matches the package version
        run: Rscript tools/release.R check "$GITHUB_REF_NAME"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Build the source package
        run: R CMD build .

      - name: Check it as CRAN would
        run: |
          tarball <- list.files(pattern = "^dataexcept_.*\\.tar\\.gz$")
          rcmdcheck::rcmdcheck(tarball,
            args = c("--as-cran", "--no-manual"),
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Extract the release notes
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v heading="# dataexcept $tag" '
            $0 == heading { found = 1; next }
            found && /^# / { exit }
            found { print }
          ' NEWS.md > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dataexcept_*.tar.gz \
            --title "dataexcept ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
