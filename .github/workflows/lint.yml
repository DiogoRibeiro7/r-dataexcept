# Style, lint and spelling. Each step fails the job on any finding.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: lint

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::styler, any::spelling, local::.
          needs: lint

      - name: Lint
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0L) quit(status = 1)
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Check formatting
        run: |
          changed <- styler::style_pkg(dry = "on", include_roxygen_examples = TRUE)
          files <- changed$file[changed$changed]
          if (length(files) > 0L) {
            cat("Not styled with styler::style_pkg():", files, sep = "\n  ")
            quit(status = 1)
          }
        shell: Rscript {0}

      - name: Check spelling
        run: |
          problems <- spelling::spell_check_package()
          print(problems)
          if (nrow(problems) > 0L) quit(status = 1)
        shell: Rscript {0}
