# Style, lint and spelling. Each step fails the job on any finding.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: lint

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # styler needs roxygen2 to style roxygen examples that contain a
          # backslash or %; without it those files fail to style at all.
          extra-packages: any::lintr, any::styler, any::roxygen2, any::spelling, local::.
          needs: lint

      - name: Lint
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0L) quit(status = 1)
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Check formatting
        run: |
          result <- styler::style_pkg(dry = "on", include_roxygen_examples = TRUE)
          # A file styler could not process has changed = NA; report it as
          # such, not as unstyled. Each finding becomes an annotation.
          failed <- result$file[is.na(result$changed)]
          unstyled <- result$file[result$changed %in% TRUE]
          for (f in failed) {
            cat(sprintf("::error file=%s::styler could not process this file\n", f))
          }
          for (f in unstyled) {
            cat(sprintf("::error file=%s::Not styled; run styler::style_pkg()\n", f))
          }
          if (length(failed) + length(unstyled) > 0L) quit(status = 1)
        shell: Rscript {0}

      - name: Check spelling
        run: |
          problems <- spelling::spell_check_package()
          print(problems)
          for (i in seq_len(nrow(problems))) {
            cat(sprintf(
              "::error::Unknown word '%s' in %s. Fix it, or add it to inst/WORDLIST.\n",
              problems$word[i], paste(problems$found[[i]], collapse = ", ")
            ))
          }
          if (nrow(problems) > 0L) quit(status = 1)
        shell: Rscript {0}
